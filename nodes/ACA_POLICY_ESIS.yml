operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN
          UPDATE ALLIANT_CLAIMS_ASTRUS.DBO.ACA_POLICY_ESIS AS T
          SET
              ACA_DATE_ID_EXPIRATION_DATE = TO_NUMBER(TO_VARCHAR(S.EXPIRATION_DATE, 'YYYYMMDD')),
              EXPIRATION_DATE = S.EXPIRATION_DATE,
              ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
              ACA_UPDATE_USER = 'SPACA_ACA_POLICY_ESIS_INSERTUPDATE'
          FROM {{ ref('ALLIANT_CLAIMS_ASTRUS_STAGE_DBO', 'ACA_POLICY_STAGING_ESIS') }} AS S
          WHERE S.SOURCE_SYSTEM_POLICY_ID = T.SOURCE_SYSTEM_POLICY_ID
          AND S.ACA_SOURCE_SYSTEM_ID = T.ACA_SOURCE_SYSTEM_ID
          AND T.ACA_DATE_CREATED <> CURRENT_TIMESTAMP()
          AND IFNULL(T.EXPIRATION_DATE, CAST('1776-07-04' AS DATE)) <> IFNULL(S.EXPIRATION_DATE, CAST('1776-07-04' AS DATE));
      END;
