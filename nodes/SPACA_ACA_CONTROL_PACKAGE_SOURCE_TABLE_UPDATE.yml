name: SPACA_ACA_CONTROL_PACKAGE_SOURCE_TABLE_UPDATE
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      DECLARE
          sourceGroupId INT := {{ parameters.ISOURCEGROUPID }};
          sqlDropTable VARCHAR := '';
          objectName VARCHAR;
          backupPostfix VARCHAR;
          backedupRecordCount INT := 0;
          sqlInsert VARCHAR;
          sqlTruncate VARCHAR;
          sqlCount VARCHAR;
          databaseName VARCHAR;
          schemaName VARCHAR;
          tableName VARCHAR;
          id INT;
      BEGIN
          SELECT 'BEGIN ' || COALESCE(LISTAGG('DROP TABLE IF EXISTS ' || COALESCE(DATABASE_NAME, '') || '.' || COALESCE(SCHEMA_NAME, '') || '.' || COALESCE(TABLE_NAME, '') || COALESCE(BACKUP_TABLE_NAME_POSTFIX, '') || ';', ' '), '') || ' END;'
          INTO :sqlDropTable
          FROM {{ ref_no_link('ALLIANT_CLAIMS_ASTRUS_STAGE_DBO', 'ACA_CONTROL_PACKAGE_SOURCE_TABLE') }}
          WHERE BACKED_UP_FLAG = 0
            AND SOURCE_GROUP_ID = :sourceGroupId;

          IF (sqlDropTable IS NOT NULL AND sqlDropTable != 'BEGIN  END;' AND sqlDropTable != 'BEGIN END;') THEN 
              EXECUTE IMMEDIATE sqlDropTable; 
          END IF;

          FOR row_var IN (
              SELECT ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID, DATABASE_NAME, SCHEMA_NAME, TABLE_NAME, BACKUP_TABLE_NAME_POSTFIX
              FROM {{ ref_no_link('ALLIANT_CLAIMS_ASTRUS_STAGE_DBO', 'ACA_CONTROL_PACKAGE_SOURCE_TABLE') }}
              WHERE BACKED_UP_FLAG = 0
          ) DO
              id := row_var.ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID;
              databaseName := COALESCE(row_var.DATABASE_NAME, '');
              schemaName := COALESCE(row_var.SCHEMA_NAME, '');
              tableName := COALESCE(row_var.TABLE_NAME, '');
              backupPostfix := COALESCE(row_var.BACKUP_TABLE_NAME_POSTFIX, '');
              objectName := databaseName || '.' || schemaName || '.' || tableName;

              sqlInsert := 'CREATE TABLE ' || objectName || backupPostfix || ' AS SELECT * FROM ' || objectName;
              EXECUTE IMMEDIATE sqlInsert;

              sqlCount := 'SELECT COUNT(*) FROM ' || objectName || backupPostfix;
              BEGIN
                  LET rs RESULTSET := (EXECUTE IMMEDIATE sqlCount);
                  LET c CURSOR FOR rs;
                  OPEN c;
                  FETCH c INTO backedupRecordCount;
                  CLOSE c;
              END;

              UPDATE ALLIANT_CLAIMS_ASTRUS_STAGE.DBO.ACA_CONTROL_PACKAGE_SOURCE_TABLE AS TGT
              SET TGT.BACKED_UP_FLAG = 1,
                  TGT.BACKED_UP_RECORD_COUNT = :backedupRecordCount,
                  TGT.ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
                  TGT.ACA_UPDATE_USER = 'SPACA_ACA_CONTROL_PACKAGE_SOURCE_TABLE_UPDATE'
              WHERE TGT.ACA_CONTROL_PACKAGE_SOURCE_TABLE_ID = :id;

              sqlTruncate := 'TRUNCATE TABLE ' || objectName;
              EXECUTE IMMEDIATE sqlTruncate;
          END FOR;
      END;
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
