fileVersion: 1
id: 4d3c61ab-f859-4b68-b80c-26d95368a52e
name: PSTG_SPAO_AO_CLAIM_STAGING_UPDATE
operation:
  config:
    insertStrategy: INSERT
    postSQL: ""
    preSQL: |-
      BEGIN
        USE DATABASE ALLIANT_ONE;

        -- Generate Hash
        UPDATE ALLIANT_ONE.STG.AO_CLAIM_STAGING
        SET RECORDHASHBYTE = SHA1_BINARY(
                COALESCE(carriername, '-x') || '|' || 
                COALESCE(claimnumber, '-x') || '|' || 
                COALESCE(claimnumbersuffix, '-x') || '|' || 
                COALESCE(claimreporteddate, '-x') || '|' || 
                COALESCE(clientname, '-x') || '|' || 
                COALESCE(policynumber, '-x') || '|' || 
                COALESCE(epiclookupcode, '-x') || '|' || 
                COALESCE(epicpolicynumber, '-x') || '|' || 
                COALESCE(policycustomername, '-x') || '|' || 
                COALESCE(TRY_CAST(policyyear AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(policyeffectivedate, '-x') || '|' || 
                COALESCE(policyexpirationdate, '-x') || '|' || 
                COALESCE(policycoveragetype, '-x') || '|' || 
                COALESCE(policycoveragekind, '-x') || '|' || 
                COALESCE(claimantnamefull, '-x') || '|' || 
                COALESCE(claimstatus, '-x') || '|' || 
                COALESCE(claimantage, '-x') || '|' || 
                COALESCE(claimcloseddate, '-x') || '|' || 
                COALESCE(claimmajorclasscode, '-x') || '|' || 
                COALESCE(lossdatetime, '-x') || '|' || 
                COALESCE(losstype, '-x') || '|' || 
                COALESCE(lossstate, '-x') || '|' || 
                COALESCE(lossaccidentdescription, '-x') || '|' || 
                COALESCE(valuationdate, '-x') || '|' || 
                COALESCE(currencytype, '-x') || '|' || 
                COALESCE(TRY_CAST(indemnityincurred AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(paidindemnitypaid AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(reserveindemnity AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(medicalincurred AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(reservemedical AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(medicalpaid AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(expensesincurred AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(reservesexpense AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(expensepaid AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(propertyincurred AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(propertyreserve AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(propertydamagepaid AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(totalrecoveries AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(paidlegal AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(paidbodilyinjury AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(reservetotal AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(totalpaid AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(TRY_CAST(totalincurred AS VARCHAR(250)), '-x') || '|' || 
                COALESCE(source_company, '-x') || '|'
            ),
            HASHSUM = indemnityincurred + 
                      paidindemnitypaid + 
                      reserveindemnity + 
                      medicalincurred + 
                      medicalpaid + 
                      reservemedical + 
                      expensesincurred + 
                      expensepaid + 
                      reservesexpense + 
                      propertyincurred + 
                      propertydamagepaid + 
                      propertyreserve + 
                      paidlegal + 
                      paidbodilyinjury + 
                      reservetotal + 
                      totalpaid + 
                      totalincurred + 
                      totalrecoveries;

        CREATE TEMPORARY TABLE TMPROWRANK AS 
        SELECT DISTINCT 
            s.guid,
            s.claimnumber,
            s.claimnumbersuffix,
            s.hashSum,
            s.RecordHashByte,
            ROW_NUMBER() OVER(PARTITION BY s.guid ORDER BY s.hashSum DESC) AS rowRank
        FROM ALLIANT_ONE.STG.AO_CLAIM_STAGING s;

        UPDATE ALLIANT_ONE.STG.AO_CLAIM_STAGING AS S
        SET S.sf_account_id = SOURCE.new_sf_account_id,
            S.rowrank = SOURCE.new_rowrank,
            S.sf_account_owner_id = SOURCE.new_sf_account_owner_id
        FROM (
            SELECT 
                S_INNER.guid AS join_key_guid,
                S_INNER.RecordHashByte AS join_key_hash,
                S_INNER.claimnumber AS join_key_claim,
                S_INNER.claimnumbersuffix AS join_key_suffix,
                r.sf_account_id AS new_sf_account_id,
                t.rowRank AS new_rowrank,
                r.sf_account_owner_id AS new_sf_account_owner_id
            FROM ALLIANT_ONE.STG.AO_CLAIM_STAGING AS S_INNER
            LEFT JOIN (
                SELECT DISTINCT epic_client_lookup_code, sf_account_id, sf_account_owner_id 
                FROM ALLIANT_ONE.DBO.AO_RESPONSE_FEED
                WHERE sf_account_id IS NOT NULL
            ) r ON S_INNER.epiclookupcode = r.epic_client_lookup_code
            LEFT JOIN TMPROWRANK t ON S_INNER.guid = t.guid 
                AND S_INNER.RecordHashByte = t.RecordHashByte
                AND S_INNER.claimnumber = t.claimnumber 
                AND COALESCE(S_INNER.claimnumbersuffix, 'xx') = COALESCE(t.claimnumbersuffix, 'xx')
        ) AS SOURCE
        WHERE S.guid = SOURCE.join_key_guid
          AND S.RecordHashByte = SOURCE.join_key_hash
          AND S.claimnumber = SOURCE.join_key_claim
          AND COALESCE(S.claimnumbersuffix, 'xx') = COALESCE(SOURCE.join_key_suffix, 'xx');

        DROP TABLE IF EXISTS TMPROWRANK;
      END;
    testsEnabled: true
    truncateBefore: false
